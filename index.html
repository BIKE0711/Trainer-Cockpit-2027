<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trainer Cockpit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  </head>
  <body class="bg-slate-100">
    <div id="root"></div>

    <script>
      const e = React.createElement;
      const { useState, useMemo, useEffect } = React;

      // REALE BAUSTEINE AUS DEN VOLLSTÄNDIGEN KONZEPTEN
      const DATABASE_METHODS = [
        // Kommunikation & Gesprächsführung (Magie der Worte)
        { id: 'm_kom1', name: '4-Ohren-Modell & Selbsttest', topic: 'kommunikation', type: 'training', duration: 60, doc: 'Magie_der_Worte_Leitfaden.docx', materials: ['Post-its', 'Stifte', 'Flipchart', 'Selbsttest-Bögen'] },
        { id: 'm_kom2', name: 'Gesprächsvorbereitung ZiAnNu x W', topic: 'kommunikation', type: 'training', duration: 45, doc: 'ZiAnNu_Template.docx', materials: ['A3 Bögen', 'Marker'] },
        { id: 'm_kom3', name: 'Energizer Kommunikation: Tangram', topic: 'kommunikation', type: 'both', duration: 30, doc: 'Tangram_Anleitung.pdf', materials: ['Tangram Kartensets'] },
        { id: 'm_kom4', name: 'Aktives Zuhören & Fragearten', topic: 'kommunikation', type: 'training', duration: 45, doc: 'Fragearten_Uebersicht.pdf', materials: ['Flipchart', 'Handouts'] },
        { id: 'm_kom5', name: '6 Schritte Gesprächsübung (Praxisfälle)', topic: 'kommunikation', type: 'coaching', duration: 65, doc: 'Rollenspiel_Briefing.docx', materials: ['Szenario-Karten', 'Feedback-Bögen'] },

        // Konfliktmanagement & Eskalation
        { id: 'm_kon1', name: 'Einstieg & Eigene Konflikteinstellung', topic: 'konflikt', type: 'both', duration: 45, doc: 'Konflikt_Begriffe.pdf', materials: ['Post-its', 'Metaplanwand', 'Smiley-Karten'] },
        { id: 'm_kon2', name: 'Konfliktdreieck & Dissens vs. Konflikt', topic: 'konflikt', type: 'training', duration: 40, doc: 'Glasl_Phasen.pdf', materials: ['Flipchart', 'Video Kosakenzipfel'] },
        { id: 'm_kon3', name: '5 Konfliktmuster & Buddy-Reflexion', topic: 'konflikt', type: 'both', duration: 50, doc: 'Konfliktmuster_Test.docx', materials: ['Test-Unterlagen', 'Timer'] },
        { id: 'm_kon4', name: 'GPS-Leitfaden zum Lösen von Konflikten', topic: 'konflikt', type: 'training', duration: 45, doc: 'GPS_Leitfaden.pdf', materials: ['Handouts', '3-W Feedback Bogen'] },
        { id: 'm_kon5', name: 'Blue Issues Rollenspiele & Fallarbeit', topic: 'konflikt', type: 'coaching', duration: 90, doc: 'Blue_Issues_Cases.docx', materials: ['Fallbeschreibungen', 'Beobachter-Bögen'] },
        { id: 'm_kon6', name: 'Eskalationsstufen nach Glasl (9 Stufen)', topic: 'konflikt', type: 'training', duration: 45, doc: 'Eskalationsstufen_Uebersicht.pdf', materials: ['Moderationskarten'] },

        // Generische Module
        { id: 'm_gen1', name: 'Check-in & Erwartungsabfrage', topic: 'general', type: 'both', duration: 30, doc: 'CheckIn_Methoden.pdf', materials: ['Post-its', 'Stifte'] },
        { id: 'm_gen2', name: 'Action Planning & Transfer-Buddies', topic: 'general', type: 'both', duration: 30, doc: 'Transfer_Vereinbarung.docx', materials: ['Action-Canvas', 'Stifte'] }
      ];

      function App() {
        const [activeTab, setActiveTab] = useState('planner');
        
        // Filter Einstellungen
        const [days, setDays] = useState(1);
        const [groupSize, setGroupSize] = useState(12);
        const [format, setFormat] = useState('training');
        const [hierarchy, setHierarchy] = useState('fuehrung');
        const [goal, setGoal] = useState('kommunikation'); // 'kommunikation', 'konflikt', 'leadership', 'teambuilding'

        const [methods, setMethods] = useState(DATABASE_METHODS);
        const [schedule, setSchedule] = useState([]);
        const [newMethod, setNewMethod] = useState({ name: '', type: 'training', topic: 'kommunikation', duration: 45, materials: '', doc: '' });

        // Automatischer Fahrplan-Generator basierend auf Filtern
        useEffect(() => {
          let selectedTopic = goal;
          let filtered = methods.filter(m => m.topic === selectedTopic || m.topic === 'general');
          
          if (format === 'training') {
            filtered = filtered.filter(m => m.type === 'training' || m.type === 'both');
          } else if (format === 'coaching') {
            filtered = filtered.filter(m => m.type === 'coaching' || m.type === 'both');
          }

          // Generiere Tagesstruktur mit festen Pausen
          const generatedSchedule = [
            { id: 'p1', time: '08:30 - 09:00', name: 'Begrüßung, Erwartungen & Spielregeln', type: 'both', duration: 30, materials: ['Post-its', 'Stifte'], doc: 'Begruessung_Standard.pdf' },
            ...(filtered[0] ? [{ id: 'p2', ...filtered[0] }] : []),
            { id: 'p_break1', time: '10:00 - 10:15', name: 'Kaffeepause', type: 'break', duration: 15, fixed: true },
            ...(filtered[1] ? [{ id: 'p3', ...filtered[1] }] : []),
            ...(filtered[2] ? [{ id: 'p4', ...filtered[2] }] : []),
            { id: 'p_lunch', time: '12:00 - 13:00', name: 'Mittagspause', type: 'break', duration: 60, fixed: true },
            { id: 'p_energizer', time: '13:00 - 13:30', name: 'Energizer / Reality Check', type: 'both', duration: 30, materials: ['Bilder-Sets / Tangram'], doc: 'Energizer_Pool.pdf' },
            ...(filtered[3] ? [{ id: 'p5', ...filtered[3] }] : []),
            { id: 'p_break2', time: '15:10 - 15:25', name: 'Nachmittagspause', type: 'break', duration: 15, fixed: true },
            ...(filtered[4] ? [{ id: 'p6', ...filtered[4] }] : []),
            { id: 'p_out', time: '16:30 - 17:00', name: 'Abschlussrunde & Key Take-Aways', type: 'both', duration: 30, materials: ['Feedback-Bögen'], doc: 'Transfer_Buddy.docx' }
          ];

          setSchedule(reindexScheduleTimes(generatedSchedule));
        }, [goal, format, days]);

        const reindexScheduleTimes = (blocks) => {
          let currentMinutes = 8 * 60 + 30; // Start 08:30 Uhr
          return blocks.map(block => {
            const startH = Math.floor(currentMinutes / 60).toString().padStart(2, '0');
            const startM = (currentMinutes % 60).toString().padStart(2, '0');
            currentMinutes += block.duration;
            const endH = Math.floor(currentMinutes / 60).toString().padStart(2, '0');
            const endM = (currentMinutes % 60).toString().padStart(2, '0');
            return { ...block, time: `${startH}:${startM} - ${endH}:${endM}` };
          });
        };

        const moveBlock = (index, direction) => {
          const newSched = [...schedule];
          const targetIndex = index + direction;
          if (targetIndex < 0 || targetIndex >= newSched.length) return;
          const temp = newSched[index];
          newSched[index] = newSched[targetIndex];
          newSched[targetIndex] = temp;
          setSchedule(reindexScheduleTimes(newSched));
        };

        const addMethodToSchedule = (method) => {
          const newBlock = { id: 'sched_' + Date.now(), ...method };
          setSchedule(reindexScheduleTimes([...schedule, newBlock]));
        };

        const removeBlock = (index) => {
          setSchedule(reindexScheduleTimes(schedule.filter((_, i) => i !== index)));
        };

        const backpackItems = useMemo(() => {
          const itemsMap = {};
          schedule.forEach(block => {
            if (block.materials) {
              block.materials.forEach(mat => {
                let qty = 1;
                if (['Post-its', 'Stifte', 'Handouts', 'Action-Canvas', 'A3 Bögen', 'Test-Unterlagen'].includes(mat)) qty = groupSize;
                itemsMap[mat] = (itemsMap[mat] || 0) + qty;
              });
            }
          });
          return Object.entries(itemsMap).map(([name, qty]) => ({ name, qty }));
        }, [schedule, groupSize]);

        const handleCreateMethod = (evt) => {
          evt.preventDefault();
          if (!newMethod.name) return;
          const created = { 
            ...newMethod, 
            id: 'm_' + Date.now(), 
            materials: newMethod.materials ? newMethod.materials.split(',').map(m => m.trim()).filter(Boolean) : [] 
          };
          setMethods([...methods, created]);
          setNewMethod({ name: '', type: 'training', topic: 'kommunikation', duration: 45, materials: '', doc: '' });
        };

        return e('div', { className: 'min-h-screen bg-slate-100 text-slate-800 flex flex-col font-sans' },
          
          // HEADER MIT LIME-GRÜN (#a7e600) ALS HAUPTFARBE
          e('header', { className: 'bg-[#a7e600] text-slate-900 px-6 py-4 shadow-md flex flex-wrap justify-between items-center gap-4' },
            e('div', { className: 'flex items-center space-x-3' },
              e('div', { className: 'bg-[#0053a0] text-white p-2.5 rounded-xl font-black text-lg shadow-sm' }, 'TC'),
              e('div', null,
                e('h1', { className: 'text-xl font-black tracking-tight text-slate-900' }, 'TRAINER COCKPIT'),
                e('p', { className: 'text-xs font-semibold text-slate-700' }, 'Auftragsklärung & Automatische Fahrplan-Generierung')
              )
            ),
            e('nav', { className: 'flex bg-slate-900/10 p-1.5 rounded-xl gap-1 border border-slate-900/10' },
              e('button', { onClick: () => setActiveTab('planner'), className: `px-5 py-2.5 rounded-lg text-sm font-extrabold transition ${activeTab === 'planner' ? 'bg-[#0053a0] text-white shadow' : 'text-slate-800 hover:bg-black/5'}` }, 'Fahrplan-Editor'),
              e('button', { onClick: () => setActiveTab('backpack'), className: `px-5 py-2.5 rounded-lg text-sm font-extrabold transition ${activeTab === 'backpack' ? 'bg-[#0053a0] text-white shadow' : 'text-slate-800 hover:bg-black/5'}` }, `Digital Backpack (${backpackItems.length})`),
              e('button', { onClick: () => setActiveTab('backend'), className: `px-5 py-2.5 rounded-lg text-sm font-extrabold transition ${activeTab === 'backend' ? 'bg-[#0053a0] text-white shadow' : 'text-slate-800 hover:bg-black/5'}` }, 'Backend')
            )
          ),

          // MAIN CONTENT
          e('main', { className: 'flex-1 p-6 max-w-7xl mx-auto w-full' },
            activeTab === 'planner' && e('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },
              
              // SIDEBAR FILTER
              e('div', { className: 'lg:col-span-4 space-y-6' },
                e('div', { className: 'bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-5' },
                  e('h2', { className: 'text-lg font-black text-[#0053a0] border-b border-slate-100 pb-2' }, 'Kunden-Parameter Filter'),
                  
                  // Zielsetzung / Focus
                  e('div', null,
                    e('label', { className: 'block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2' }, 'Kern-Zielsetzung / Thema:'),
                    e('select', { value: goal, onChange: e => setGoal(e.target.value), className: 'w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold text-slate-800 focus:outline-none focus:border-[#0053a0]' },
                      e('option', { value: 'kommunikation' }, 'Gesprächsführung & Kommunikation'),
                      e('option', { value: 'konflikt' }, 'Konfliktmanagement & Eskalation'),
                      e('option', { value: 'leadership' }, 'Führung & Leadership'),
                      e('option', { value: 'teambuilding' }, 'Teambuilding & Gruppendynamik')
                    )
                  ),

                  // Zielgruppe / Hierarchie
                  e('div', null,
                    e('label', { className: 'block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2' }, 'Zielgruppe / Hierarchie:'),
                    e('select', { value: hierarchy, onChange: e => setHierarchy(e.target.value), className: 'w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold text-slate-800 focus:outline-none focus:border-[#0053a0]' },
                      e('option', { value: 'fuehrung' }, 'Führungskräfte / Teamleiter'),
                      e('option', { value: 'talente' }, 'Talent Pool / High Potentials'),
                      e('option', { value: 'gf' }, 'Geschäftsführung / C-Level'),
                      e('option', { value: 'peers' }, 'Teams & Spezialisten (Peers)'),
                      e('option', { value: 'mixed' }, 'Gemischte Hierarchieebenen')
                    )
                  ),

                  // Format
                  e('div', null,
                    e('label', { className: 'block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2' }, 'Format-Ausrichtung:'),
                    e('div', { className: 'grid grid-cols-3 gap-2' },
                      ['training', 'mix', 'coaching'].map(f =>
                        e('button', { key: f, onClick: () => setFormat(f), className: `py-2.5 text-xs rounded-xl font-black capitalize border transition ${format === f ? 'bg-[#0053a0] text-white border-[#0053a0] shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}` }, f === 'mix' ? 'Mischform' : f)
                      )
                    )
                  ),

                  // Regler Dauer & TN
                  e('div', { className: 'space-y-4 pt-2 border-t border-slate-100' },
                    e('div', null,
                      e('div', { className: 'flex justify-between text-sm font-bold mb-1' },
                        e('span', { className: 'text-slate-600' }, 'Dauer:'),
                        e('span', { className: 'text-[#0053a0]' }, `${days} Tag(e)`)
                      ),
                      e('input', { type: 'range', min: 1, max: 5, value: days, onChange: e => setDays(Number(e.target.value)), className: 'w-full accent-[#0053a0]' })
                    ),
                    e('div', null,
                      e('div', { className: 'flex justify-between text-sm font-bold mb-1' },
                        e('span', { className: 'text-slate-600' }, 'Teilnehmeranzahl:'),
                        e('span', { className: 'text-[#0053a0]' }, `${groupSize} Personen`)
                      ),
                      e('input', { type: 'range', min: 2, max: 30, value: groupSize, onChange: e => setGroupSize(Number(e.target.value)), className: 'w-full accent-[#0053a0]' })
                    )
                  )
                ),

                // METHODEN BIBLIOTHEK
                e('div', { className: 'bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4' },
                  e('h3', { className: 'text-xs font-black text-slate-400 uppercase tracking-wider' }, `Verfügbare Bausteine (${methods.length})`),
                  e('div', { className: 'space-y-2 max-h-80 overflow-y-auto pr-1' },
                    methods.map(m =>
                      e('div', { key: m.id, className: 'p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center hover:border-[#0053a0] transition' },
                        e('div', { className: 'pr-2' },
                          e('div', { className: 'font-bold text-sm text-slate-800' }, m.name),
                          e('div', { className: 'text-xs text-slate-500 mt-0.5' }, `${m.duration} Min | ${m.type}`),
                          m.doc && e('div', { className: 'text-[10px] text-[#0053a0] font-semibold mt-1' }, `📄 ${m.doc}`)
                        ),
                        e('button', { onClick: () => addMethodToSchedule(m), className: 'px-3 py-1.5 bg-[#0053a0] text-white rounded-lg font-extrabold text-xs shadow-sm hover:bg-[#003d75] transition shrink-0' }, '+ Einbauen')
                      )
                    )
                  )
                )
              ),

              // VORGESCHLAGENER / INTERAKTIVER FAHRPLAN
              e('div', { className: 'lg:col-span-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6' },
                e('div', { className: 'flex justify-between items-center border-b border-slate-100 pb-4' },
                  e('div', null,
                    e('h2', { className: 'text-xl font-black text-[#0053a0]' }, `Vorgeschlagener Fahrplan (Tag 1 von ${days})`),
                    e('p', { className: 'text-xs text-slate-500 font-medium mt-0.5' }, `Automatisches Match für: ${goal.toUpperCase()} | ${hierarchy.toUpperCase()}`)
                  ),
                  e('span', { className: 'text-sm font-black bg-blue-50 text-[#0053a0] px-3 py-1 rounded-full border border-blue-100' }, `${schedule.length} Blöcke`)
                ),

                e('div', { className: 'space-y-3' },
                  schedule.map((block, index) =>
                    e('div', { key: block.id || index, className: `p-4 rounded-xl border flex items-center justify-between gap-4 transition ${block.type === 'break' ? 'bg-slate-50 text-slate-400 border-slate-200' : 'bg-white border-slate-200 shadow-sm hover:border-[#0053a0]'}` },
                      e('div', { className: 'w-28 font-mono text-xs font-black text-[#0053a0] bg-blue-50 px-2 py-1.5 rounded-lg text-center border border-blue-100 shrink-0' }, block.time),
                      e('div', { className: 'flex-1 min-w-0' },
                        e('div', { className: 'font-bold text-sm text-slate-800 flex items-center gap-2 flex-wrap' },
                          block.name,
                          block.type === 'coaching' && e('span', { className: 'text-[10px] px-2 py-0.5 rounded bg-[#0053a0] text-white font-extrabold' }, 'Coaching'),
                          block.type === 'training' && e('span', { className: 'text-[10px] px-2 py-0.5 rounded bg-[#a7e600] text-slate-900 font-extrabold' }, 'Training')
                        ),
                        e('div', { className: 'text-xs text-slate-500 mt-1 flex items-center gap-3 flex-wrap' },
                          e('span', null, `Dauer: ${block.duration} Min`),
                          block.doc && e('span', { className: 'text-[#0053a0] font-bold' }, `📎 ${block.doc}`)
                        )
                      ),
                      !block.fixed && e('div', { className: 'flex gap-1 shrink-0' },
                        e('button', { onClick: () => moveBlock(index, -1), disabled: index === 0, className: 'px-2 py-1 text-xs border rounded-lg bg-slate-50 hover:bg-slate-100 font-bold' }, '▲'),
                        e('button', { onClick: () => moveBlock(index, 1), disabled: index === schedule.length - 1, className: 'px-2 py-1 text-xs border rounded-lg bg-slate-50 hover:bg-slate-100 font-bold' }, '▼'),
                        e('button', { onClick: () => removeBlock(index), className: 'px-2 py-1 text-xs bg-red-50 text-red-600 border border-red-200 rounded-lg font-black hover:bg-red-100' }, '✕')
                      )
                    )
                  )
                )
              )
            ),

            // DIGITAL BACKPACK TAB
            activeTab === 'backpack' && e('div', { className: 'bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6 max-w-4xl mx-auto' },
              e('h2', { className: 'text-xl font-black text-[#0053a0] border-b pb-4' }, `Digitaler Backpack (${groupSize} Teilnehmer)`),
              e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                backpackItems.map((item, idx) =>
                  e('div', { key: idx, className: 'p-4 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center' },
                    e('span', { className: 'font-bold text-slate-700' }, item.name),
                    e('span', { className: 'px-3 py-1 bg-[#0053a0] text-white rounded-full text-xs font-black' }, `${item.qty}x benötigt`)
                  )
                )
              )
            ),

            // BACKEND TAB (NUR NOCH "BACKEND" MIT DOKUMENTEN-UPLOAD-MÖGLICHKEIT)
            activeTab === 'backend' && e('div', { className: 'bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6 max-w-4xl mx-auto' },
              e('h2', { className: 'text-xl font-black text-[#0053a0] border-b pb-4' }, 'Backend: Methoden & Unterlagen verwalten'),
              e('form', { onSubmit: handleCreateMethod, className: 'bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4' },
                e('h3', { className: 'text-md font-bold text-[#0053a0]' }, 'Neue Methode mit Word/PDF-Vorlage anlegen'),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                  e('input', { type: 'text', value: newMethod.name, onChange: evt => setNewMethod({ ...newMethod, name: evt.target.value }), placeholder: 'Methoden-Name (z.B. 4-Ohren-Modell)', required: true, className: 'p-3 border border-slate-200 rounded-xl text-sm font-semibold' }),
                  e('select', { value: newMethod.topic, onChange: evt => setNewMethod({ ...newMethod, topic: evt.target.value }), className: 'p-3 border border-slate-200 rounded-xl text-sm font-semibold' },
                    e('option', { value: 'kommunikation' }, 'Kommunikation & Gesprächsführung'),
                    e('option', { value: 'konflikt' }, 'Konfliktmanagement & Eskalation'),
                    e('option', { value: 'leadership' }, 'Leadership'),
                    e('option', { value: 'general' }, 'Allgemein / Eisholz')
                  ),
                  e('select', { value: newMethod.type, onChange: evt => setNewMethod({ ...newMethod, type: evt.target.value }), className: 'p-3 border border-slate-200 rounded-xl text-sm font-semibold' },
                    e('option', { value: 'training' }, 'Training'),
                    e('option', { value: 'coaching' }, 'Teamcoaching'),
                    e('option', { value: 'both' }, 'Beides')
                  ),
                  e('input', { type: 'number', value: newMethod.duration, onChange: evt => setNewMethod({ ...newMethod, duration: Number(evt.target.value) }), placeholder: 'Dauer in Min', className: 'p-3 border border-slate-200 rounded-xl text-sm font-semibold' }),
                  e('input', { type: 'text', value: newMethod.doc, onChange: evt => setNewMethod({ ...newMethod, doc: evt.target.value }), placeholder: 'Dateiname (z.B. Leitfaden.docx / Leitfaden.pdf)', className: 'p-3 border border-slate-200 rounded-xl text-sm font-semibold' }),
                  e('input', { type: 'text', value: newMethod.materials, onChange: evt => setNewMethod({ ...newMethod, materials: evt.target.value }), placeholder: 'Materialien (z.B. Flipchart, Post-its)', className: 'p-3 border border-slate-200 rounded-xl text-sm font-semibold' })
                ),
                e('button', { type: 'submit', className: 'w-full py-3.5 bg-[#a7e600] text-slate-900 font-black text-sm rounded-xl shadow hover:bg-[#96ce00] transition' }, '+ Methode & Dokument in Datenbank speichern')
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
  </body>
</html>
