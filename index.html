<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trainer Cockpit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  </head>
  <body class="bg-slate-100">
    <div id="root"></div>

    <script>
      const e = React.createElement;
      const { useState, useMemo } = React;

      // INITIAL DATA
      const INITIAL_METHODS = [
        { id: 'm1', name: 'Check-in & Erwartungsabfrage', type: 'both', duration: 30, materials: ['Post-its', 'Stifte', 'Flipchart'] },
        { id: 'm2', name: 'Theoretischer Impuls & Input', type: 'training', duration: 45, materials: ['Beamer', 'Handouts'] },
        { id: 'm3', name: 'Kleingruppen-Reflection', type: 'both', duration: 60, materials: ['Moderationskarten', 'Marker'] },
        { id: 'm4', name: 'Kollegiale Fallberatung', type: 'coaching', duration: 90, materials: ['Timer', 'A3 Bögen'] },
        { id: 'm5', name: 'Rollenspiel & Simulation', type: 'training', duration: 60, materials: ['Szenario-Karten', 'Feedback-Bögen'] },
        { id: 'm6', name: 'Systemische Aufstellung / Soziogramm', type: 'coaching', duration: 75, materials: ['Bodenseile / Marker'] },
        { id: 'm7', name: 'Action Planning & Transfer', type: 'both', duration: 45, materials: ['Action-Canvas', 'Stifte'] }
      ];

      function App() {
        const [activeTab, setActiveTab] = useState('planner');
        const [days, setDays] = useState(1);
        const [groupSize, setGroupSize] = useState(8);
        const [format, setFormat] = useState('mix');
        const [hierarchy, setHierarchy] = useState('peers');
        const [isMultiTerm, setIsMultiTerm] = useState(false);
        const [methods, setMethods] = useState(INITIAL_METHODS);

        const [schedule, setSchedule] = useState([
          { id: 'p1', time: '09:00 - 09:30', name: 'Ankommen & Kaffeeempfang', type: 'break', duration: 30, fixed: true },
          { id: 'p2', time: '09:30 - 10:00', name: 'Check-in & Erwartungsabfrage', type: 'both', duration: 30, materials: ['Post-its', 'Stifte', 'Flipchart'] },
          { id: 'p3', time: '10:00 - 10:45', name: 'Theoretischer Impuls & Input', type: 'training', duration: 45, materials: ['Beamer', 'Handouts'] },
          { id: 'p4', time: '10:45 - 11:00', name: 'Kaffeepause', type: 'break', duration: 15, fixed: true },
          { id: 'p5', time: '11:00 - 12:30', name: 'Kollegiale Fallberatung', type: 'coaching', duration: 90, materials: ['Timer', 'A3 Bögen'] },
          { id: 'p6', time: '12:30 - 13:30', name: 'Mittagspause', type: 'break', duration: 60, fixed: true },
          { id: 'p7', time: '13:30 - 15:00', name: 'Kleingruppen-Reflection', type: 'both', duration: 90, materials: ['Moderationskarten', 'Marker'] },
          { id: 'p8', time: '15:00 - 15:15', name: 'Nachmittagspause', type: 'break', duration: 15, fixed: true },
          { id: 'p9', time: '15:15 - 16:30', name: 'Action Planning & Transfer', type: 'both', duration: 75, materials: ['Action-Canvas', 'Stifte'] },
          { id: 'p10', time: '16:30 - 17:00', name: 'Abschluss-Check-out', type: 'both', duration: 30, materials: ['Post-its'] }
        ]);

        const [newMethod, setNewMethod] = useState({ name: '', type: 'training', duration: 45, materials: '' });

        const reindexScheduleTimes = (blocks) => {
          let currentMinutes = 9 * 60;
          return blocks.map(block => {
            const startH = Math.floor(currentMinutes / 60).toString().padStart(2, '0');
            const startM = (currentMinutes % 60).toString().padStart(2, '0');
            currentMinutes += block.duration;
            const endH = Math.floor(currentMinutes / 60).toString().padStart(2, '0');
            const endM = (currentMinutes % 60).toString().padStart(2, '0');
            return { ...block, time: `${startH}:${startM} - ${endH}:${endM}` };
          });
        };

        const moveBlock = (index, direction) => {
          const newSched = [...schedule];
          const targetIndex = index + direction;
          if (targetIndex < 0 || targetIndex >= newSched.length) return;
          const temp = newSched[index];
          newSched[index] = newSched[targetIndex];
          newSched[targetIndex] = temp;
          setSchedule(reindexScheduleTimes(newSched));
        };

        const addMethodToSchedule = (method) => {
          const newBlock = { id: 'sched_' + Date.now(), name: method.name, type: method.type, duration: method.duration, materials: method.materials || [] };
          setSchedule(reindexScheduleTimes([...schedule, newBlock]));
        };

        const removeBlock = (index) => {
          setSchedule(reindexScheduleTimes(schedule.filter((_, i) => i !== index)));
        };

        const backpackItems = useMemo(() => {
          const itemsMap = {};
          schedule.forEach(block => {
            if (block.materials) {
              block.materials.forEach(mat => {
                let qty = 1;
                if (['Post-its', 'Stifte', 'Handouts', 'Action-Canvas', 'A3 Bögen'].includes(mat)) qty = groupSize;
                itemsMap[mat] = (itemsMap[mat] || 0) + qty;
              });
            }
          });
          return Object.entries(itemsMap).map(([name, qty]) => ({ name, qty }));
        }, [schedule, groupSize]);

        const handleCreateMethod = (evt) => {
          evt.preventDefault();
          if (!newMethod.name) return;
          const created = { ...newMethod, id: 'm_' + Date.now(), materials: newMethod.materials.split(',').map(m => m.trim()).filter(Boolean) };
          setMethods([...methods, created]);
          setNewMethod({ name: '', type: 'training', duration: 45, materials: '' });
        };

        return e('div', { className: 'min-h-screen bg-slate-100 text-slate-800 flex flex-col font-sans' },
          // HEADER
          e('header', { className: 'bg-[#0053a0] text-white px-6 py-4 shadow-md flex flex-wrap justify-between items-center gap-4' },
            e('div', { className: 'flex items-center space-x-3' },
              e('div', { className: 'bg-[#a7e600] p-2 rounded-lg text-slate-900 font-bold' }, 'TC'),
              e('div', null,
                e('h1', { className: 'text-xl font-extrabold text-white tracking-wide' }, 'TRAINER COCKPIT'),
                e('p', { className: 'text-xs text-blue-100' }, 'Auftragsklärung & Flexible Fahrplan-Generierung')
              )
            ),
            e('nav', { className: 'flex bg-[#003d75] p-1 rounded-xl gap-1' },
              e('button', { onClick: () => setActiveTab('planner'), className: `px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'planner' ? 'bg-[#a7e600] text-slate-900' : 'text-blue-100 hover:text-white'}` }, 'Fahrplan-Editor'),
              e('button', { onClick: () => setActiveTab('backpack'), className: `px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'backpack' ? 'bg-[#a7e600] text-slate-900' : 'text-blue-100 hover:text-white'}` }, `Digital Backpack (${backpackItems.length})`),
              e('button', { onClick: () => setActiveTab('backend'), className: `px-4 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'backend' ? 'bg-[#a7e600] text-slate-900' : 'text-blue-100 hover:text-white'}` }, 'Methoden-Backend')
            )
          ),

          // MAIN CONTENT
          e('main', { className: 'flex-1 p-6 max-w-7xl mx-auto w-full' },
            activeTab === 'planner' && e('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },
              // SIDEBAR
              e('div', { className: 'lg:col-span-4 space-y-6' },
                e('div', { className: 'bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-5' },
                  e('h2', { className: 'text-lg font-bold text-[#0053a0]' }, 'Kunden-Parameter Filter'),
                  e('div', null,
                    e('div', { className: 'flex justify-between text-sm mb-1 font-medium' },
                      e('span', { className: 'text-slate-600' }, 'Dauer (Tage):'),
                      e('span', { className: 'font-bold text-[#0053a0]' }, `${days} Tag(e)`)
                    ),
                    e('input', { type: 'range', min: 1, max: 10, value: days, onChange: e => setDays(Number(e.target.value)), className: 'w-full accent-[#0053a0]' })
                  ),
                  e('div', null,
                    e('div', { className: 'flex justify-between text-sm mb-1 font-medium' },
                      e('span', { className: 'text-slate-600' }, 'Teilnehmeranzahl:'),
                      e('span', { className: 'font-bold text-[#0053a0]' }, `${groupSize} Personen`)
                    ),
                    e('input', { type: 'range', min: 2, max: 35, value: groupSize, onChange: e => setGroupSize(Number(e.target.value)), className: 'w-full accent-[#0053a0]' })
                  ),
                  e('div', null,
                    e('label', { className: 'block text-sm font-medium text-slate-600 mb-2' }, 'Format-Ausrichtung:'),
                    e('div', { className: 'grid grid-cols-3 gap-2' },
                      ['training', 'mix', 'coaching'].map(f =>
                        e('button', { key: f, onClick: () => setFormat(f), className: `py-2 text-xs rounded-lg font-bold capitalize border ${format === f ? 'bg-[#0053a0] text-white' : 'bg-slate-50 text-slate-600'}` }, f === 'mix' ? 'Mischform' : f)
                      )
                    )
                  )
                ),
                e('div', { className: 'bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4' },
                  e('h3', { className: 'text-xs font-bold text-slate-400 uppercase' }, `Passende Bausteine (${methods.length})`),
                  e('div', { className: 'space-y-2 max-h-80 overflow-y-auto' },
                    methods.map(m =>
                      e('div', { key: m.id, className: 'p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center' },
                        e('div', null,
                          e('div', { className: 'font-bold text-sm text-slate-800' }, m.name),
                          e('div', { className: 'text-xs text-slate-500' }, `${m.duration} Min | ${m.type}`)
                        ),
                        e('button', { onClick: () => addMethodToSchedule(m), className: 'px-3 py-1 bg-[#a7e600] text-slate-900 rounded-lg font-bold text-xs' }, '+ Hinzufügen')
                      )
                    )
                  )
                )
              ),

              // TIMELINE
              e('div', { className: 'lg:col-span-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6' },
                e('div', { className: 'flex justify-between items-center border-b border-slate-100 pb-4' },
                  e('h2', { className: 'text-xl font-extrabold text-[#0053a0]' }, `Interaktiver Fahrplan (Tag 1 von ${days})`),
                  e('span', { className: 'text-lg font-black text-[#0053a0]' }, `${schedule.length} Blöcke`)
                ),
                e('div', { className: 'space-y-3' },
                  schedule.map((block, index) =>
                    e('div', { key: block.id || index, className: `p-4 rounded-xl border flex items-center justify-between gap-4 ${block.type === 'break' ? 'bg-slate-50 text-slate-400' : 'bg-white border-slate-200 shadow-sm'}` },
                      e('div', { className: 'w-28 font-mono text-xs font-bold text-[#0053a0] bg-blue-50 px-2 py-1 rounded text-center border border-blue-100' }, block.time),
                      e('div', { className: 'flex-1' },
                        e('div', { className: 'font-bold text-sm flex items-center gap-2' },
                          block.name,
                          block.type === 'coaching' && e('span', { className: 'text-xs px-2 py-0.5 rounded bg-[#0053a0] text-white font-semibold' }, 'Coaching'),
                          block.type === 'training' && e('span', { className: 'text-xs px-2 py-0.5 rounded bg-[#a7e600] text-slate-900 font-semibold' }, 'Training')
                        ),
                        e('div', { className: 'text-xs text-slate-500 mt-0.5' }, `Dauer: ${block.duration} Min`)
                      ),
                      !block.fixed && e('div', { className: 'flex gap-1' },
                        e('button', { onClick: () => moveBlock(index, -1), disabled: index === 0, className: 'px-2 py-1 text-xs border rounded bg-slate-50' }, '▲'),
                        e('button', { onClick: () => moveBlock(index, 1), disabled: index === schedule.length - 1, className: 'px-2 py-1 text-xs border rounded bg-slate-50' }, '▼'),
                        e('button', { onClick: () => removeBlock(index), className: 'px-2 py-1 text-xs bg-red-50 text-red-600 border border-red-200 rounded font-bold' }, 'X')
                      )
                    )
                  )
                )
              )
            ),

            // BACKPACK TAB
            activeTab === 'backpack' && e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6 max-w-4xl mx-auto' },
              e('h2', { className: 'text-xl font-extrabold text-[#0053a0] border-b pb-4' }, `Digitaler Backpack (${groupSize} Teilnehmer)`),
              e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                backpackItems.map((item, idx) =>
                  e('div', { key: idx, className: 'p-4 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center' },
                    e('span', { className: 'font-bold text-slate-700' }, item.name),
                    e('span', { className: 'px-3 py-1 bg-[#0053a0] text-white rounded-full text-xs font-bold' }, `${item.qty}x`)
                  )
                )
              )
            ),

            // BACKEND TAB
            activeTab === 'backend' && e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6 max-w-4xl mx-auto' },
              e('h2', { className: 'text-xl font-extrabold text-[#0053a0] border-b pb-4' }, 'Methoden-Backend'),
              e('form', { onSubmit: handleCreateMethod, className: 'bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4' },
                e('h3', { className: 'text-md font-bold text-[#0053a0]' }, 'Neue Methode anlegen'),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                  e('input', { type: 'text', value: newMethod.name, onChange: evt => setNewMethod({ ...newMethod, name: evt.target.value }), placeholder: 'Methoden-Name', required: true, className: 'p-2 border rounded' }),
                  e('select', { value: newMethod.type, onChange: evt => setNewMethod({ ...newMethod, type: evt.target.value }), className: 'p-2 border rounded' },
                    e('option', { value: 'training' }, 'Training'),
                    e('option', { value: 'coaching' }, 'Teamcoaching'),
                    e('option', { value: 'both' }, 'Beides')
                  ),
                  e('input', { type: 'number', value: newMethod.duration, onChange: evt => setNewMethod({ ...newMethod, duration: Number(evt.target.value) }), className: 'p-2 border rounded' }),
                  e('input', { type: 'text', value: newMethod.materials, onChange: evt => setNewMethod({ ...newMethod, materials: evt.target.value }), placeholder: 'Materialien (kommagetrennt)', className: 'p-2 border rounded' })
                ),
                e('button', { type: 'submit', className: 'w-full py-3 bg-[#a7e600] text-slate-900 font-extrabold rounded-lg shadow' }, '+ Methode speichern')
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
  </body>
</html>
